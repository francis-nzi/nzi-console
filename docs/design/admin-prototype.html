<title>NZI Admin Console</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  /* Layout concept: fixed instrument-panel frame — deep-quiet left rail, calm top bar, one working canvas.
     Governance (audit, provenance, deactivate-not-delete, capability + environment) rendered as first-class UI. */
  :root{
    --bg:#F2F5F3; --surface:#FFFFFF; --surface-2:#F7F9F8; --rail:#12201B; --rail-2:#1B2E27; --rail-ink:#C9D6D0; --rail-ink-2:#7E938B;
    --ink:#17201C; --ink-2:#586460; --ink-3:#8A938E; --line:#DEE4E1; --line-2:#EAEEEC;
    --accent:#0E7C5A; --accent-ink:#0B6349; --accent-weak:#E2F0EA;
    --ok:#0B7A4B; --ok-bg:#DFF3E9; --warn:#8A5A0F; --warn-bg:#FBEFD6; --bad:#B23A2B; --bad-bg:#FBE7E3; --muted-bg:#EDF1EF;
    --shadow:0 1px 2px rgba(16,32,26,.05),0 8px 24px -12px rgba(16,32,26,.14);
    --shadow-lg:0 24px 60px -24px rgba(16,32,26,.35);
    --f-sans:"Hanken Grotesk",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    --r:10px; --r-sm:7px;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --bg:#0D1310; --surface:#141C18; --surface-2:#101713; --rail:#0A100D; --rail-2:#141F1A; --rail-ink:#B7C6BF; --rail-ink-2:#6C7F77;
    --ink:#E8EDEA; --ink-2:#A3AEA8; --ink-3:#727C77; --line:#25302A; --line-2:#1C251F;
    --accent:#3FBE8C; --accent-ink:#57CF9F; --accent-weak:#12271F;
    --ok:#48C089; --ok-bg:#122A1F; --warn:#D9A648; --warn-bg:#2C2411; --bad:#E0796B; --bad-bg:#2E1815; --muted-bg:#1A231E;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6); --shadow-lg:0 28px 70px -28px rgba(0,0,0,.7);
    color-scheme:dark;
  }}
  :root[data-theme="dark"]{
    --bg:#0D1310; --surface:#141C18; --surface-2:#101713; --rail:#0A100D; --rail-2:#141F1A; --rail-ink:#B7C6BF; --rail-ink-2:#6C7F77;
    --ink:#E8EDEA; --ink-2:#A3AEA8; --ink-3:#727C77; --line:#25302A; --line-2:#1C251F;
    --accent:#3FBE8C; --accent-ink:#57CF9F; --accent-weak:#12271F;
    --ok:#48C089; --ok-bg:#122A1F; --warn:#D9A648; --warn-bg:#2C2411; --bad:#E0796B; --bad-bg:#2E1815; --muted-bg:#1A231E;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6); --shadow-lg:0 28px 70px -28px rgba(0,0,0,.7);
    color-scheme:dark;
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-sans);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
  h1,h2,h3,h4{margin:0;font-weight:600;text-wrap:balance;letter-spacing:-.01em}
  button{font-family:inherit;font-size:inherit;cursor:pointer}
  a{color:var(--accent-ink);text-decoration:none}
  ::selection{background:var(--accent-weak)}

  .app{display:grid;grid-template-columns:246px 1fr;height:100%;min-height:0}

  /* ── Rail ─────────────────────────────────────────── */
  .rail{background:var(--rail);color:var(--rail-ink);display:flex;flex-direction:column;min-height:0;border-right:1px solid rgba(0,0,0,.2)}
  .brand{display:flex;align-items:center;gap:10px;padding:16px 16px 14px}
  .mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(150deg,var(--accent),#0B6349);display:grid;place-items:center;flex:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}
  .mark svg{width:17px;height:17px}
  .brand b{color:#fff;font-size:14.5px;font-weight:600;letter-spacing:-.02em;line-height:1.05;display:block}
  .brand span{color:var(--rail-ink-2);font-family:var(--f-mono);font-size:10px;letter-spacing:.04em;text-transform:uppercase}
  .nav{overflow-y:auto;padding:6px 10px 16px;flex:1;min-height:0}
  .nav-group{margin-top:14px}
  .nav-group>p{margin:0 0 4px;padding:0 8px;font-family:var(--f-mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--rail-ink-2)}
  .nav-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;color:var(--rail-ink);padding:7px 8px;border-radius:7px;font-size:13px;font-weight:500;transition:background .12s,color .12s}
  .nav-item svg{width:16px;height:16px;flex:none;opacity:.82}
  .nav-item .count{margin-left:auto;font-family:var(--f-mono);font-size:10.5px;color:var(--rail-ink-2);background:rgba(255,255,255,.05);padding:1px 6px;border-radius:20px}
  .nav-item:hover{background:var(--rail-2);color:#fff}
  .nav-item.on{background:var(--rail-2);color:#fff}
  .nav-item.on svg{opacity:1;color:var(--accent-ink)}
  .nav-item.on .count{color:var(--rail-ink);background:rgba(63,190,140,.16)}
  .rail-foot{border-top:1px solid rgba(255,255,255,.07);padding:12px 14px;display:flex;align-items:center;gap:10px}
  .avatar{width:28px;height:28px;border-radius:50%;background:var(--rail-2);display:grid;place-items:center;font-size:11px;font-weight:600;color:#fff;flex:none}
  .rail-foot .who{min-width:0}
  .rail-foot .who b{display:block;color:#fff;font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rail-foot .who span{color:var(--rail-ink-2);font-size:11px}

  /* ── Main ─────────────────────────────────────────── */
  .main{display:flex;flex-direction:column;min-width:0;min-height:0}
  .topbar{display:flex;align-items:center;gap:12px;padding:11px 22px;border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
  .hamb{display:none;background:none;border:1px solid var(--line);border-radius:8px;width:34px;height:34px;color:var(--ink-2);align-items:center;justify-content:center;flex:none}
  .crumb{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--ink-3);min-width:0}
  .crumb b{color:var(--ink);font-weight:600}
  .crumb .sep{opacity:.5}
  .search{margin-left:auto;position:relative;display:flex;align-items:center}
  .search svg{position:absolute;left:9px;width:15px;height:15px;color:var(--ink-3)}
  .search input{width:210px;max-width:32vw;padding:7px 10px 7px 30px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);color:var(--ink);font-size:13px;font-family:inherit}
  .search input:focus{outline:2px solid var(--accent-weak);border-color:var(--accent);background:var(--surface)}
  .env{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:10.5px;font-weight:500;color:var(--warn);background:var(--warn-bg);padding:4px 9px;border-radius:20px;white-space:nowrap}
  .env i{width:6px;height:6px;border-radius:50%;background:var(--warn)}
  .icon-btn{background:none;border:1px solid var(--line);border-radius:8px;width:34px;height:34px;color:var(--ink-2);display:grid;place-items:center;flex:none}
  .icon-btn:hover{background:var(--surface-2);color:var(--ink)}

  .canvas{overflow-y:auto;flex:1;min-height:0}
  .wrap{max-width:1120px;margin:0 auto;padding-block:26px;padding-left:22px;padding-right:22px}
  .proto-note{background:var(--accent-weak);color:var(--accent-ink);font-size:12px;font-weight:500;text-align:center;padding:6px 16px;border-bottom:1px solid var(--line)}
  .proto-note b{font-weight:700}

  .page-head{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:20px}
  .page-head .eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-ink);font-weight:500}
  .page-head h1{font-size:23px;margin-top:3px}
  .page-head p{margin:6px 0 0;color:var(--ink-2);max-width:60ch;font-size:13.5px}
  .head-actions{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .cap{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:10.5px;color:var(--ink-2);background:var(--muted-bg);border:1px solid var(--line);padding:4px 8px;border-radius:6px}
  .cap svg{width:12px;height:12px;opacity:.7}

  .btn{display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:500;font-size:13px;transition:background .12s,border-color .12s}
  .btn:hover{background:var(--surface-2)}
  .btn svg{width:15px;height:15px}
  .btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.pri:hover{background:var(--accent-ink)}
  .btn.sm{padding:5px 10px;font-size:12.5px}
  .btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
  .btn.ghost:hover{background:var(--surface-2);color:var(--ink)}

  /* cards / metrics */
  .grid{display:grid;gap:14px}
  .cols-4{grid-template-columns:repeat(4,1fr)}
  .cols-3{grid-template-columns:repeat(3,1fr)}
  .cols-2{grid-template-columns:1.6fr 1fr}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
  .pad{padding:16px 18px}
  .metric .l{font-size:12px;color:var(--ink-2);display:flex;align-items:center;gap:7px}
  .metric .l svg{width:14px;height:14px;color:var(--accent-ink)}
  .metric .v{font-size:27px;font-weight:600;letter-spacing:-.02em;margin-top:8px;font-variant-numeric:tabular-nums}
  .metric .s{font-size:11.5px;color:var(--ink-3);margin-top:2px}

  .sec-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .sec-card{display:flex;flex-direction:column;gap:9px;text-align:left;padding:15px 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);transition:border-color .12s,transform .12s}
  .sec-card:hover{border-color:var(--accent);transform:translateY(-1px)}
  .sec-card .ic{width:32px;height:32px;border-radius:8px;background:var(--accent-weak);color:var(--accent-ink);display:grid;place-items:center}
  .sec-card .ic svg{width:17px;height:17px}
  .sec-card b{font-size:13.5px;font-weight:600}
  .sec-card p{margin:0;font-size:12px;color:var(--ink-2);line-height:1.4}
  .sec-card .foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;font-size:11.5px;color:var(--ink-3);font-family:var(--f-mono)}

  .panel-title{display:flex;align-items:center;gap:9px;padding:14px 18px;border-bottom:1px solid var(--line-2)}
  .panel-title h3{font-size:14px}
  .panel-title .badge{margin-left:auto}

  .feed{display:flex;flex-direction:column}
  .feed-row{display:flex;gap:11px;padding:11px 18px;border-bottom:1px solid var(--line-2);align-items:flex-start}
  .feed-row:last-child{border-bottom:0}
  .feed-dot{width:26px;height:26px;border-radius:7px;background:var(--muted-bg);display:grid;place-items:center;flex:none;color:var(--ink-2)}
  .feed-dot svg{width:13px;height:13px}
  .feed-row .t{font-size:12.8px}
  .feed-row .t b{font-weight:600}
  .feed-row .m{font-size:11.5px;color:var(--ink-3);margin-top:1px;font-family:var(--f-mono)}

  /* table */
  .toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
  .seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:2px}
  .seg button{border:0;background:none;color:var(--ink-2);padding:5px 11px;border-radius:6px;font-size:12.5px;font-weight:500}
  .seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
  .filter{margin-left:auto;display:flex;gap:8px;align-items:center}
  .tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  thead th{text-align:left;font-size:11px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:var(--ink-3);padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
  tbody td{padding:11px 14px;border-bottom:1px solid var(--line-2);vertical-align:middle}
  tbody tr:last-child td{border-bottom:0}
  tbody tr{cursor:pointer;transition:background .1s}
  tbody tr:hover{background:var(--surface-2)}
  .num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--f-mono);font-size:12.5px}
  .mono{font-family:var(--f-mono);font-size:12px;color:var(--ink-2)}
  .primary-cell{font-weight:600;color:var(--ink)}
  td .sub{font-size:11.5px;color:var(--ink-3)}

  .badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;white-space:nowrap}
  .badge i{width:6px;height:6px;border-radius:50%}
  .b-ok{background:var(--ok-bg);color:var(--ok)} .b-ok i{background:var(--ok)}
  .b-off{background:var(--muted-bg);color:var(--ink-3)} .b-off i{background:var(--ink-3)}
  .b-warn{background:var(--warn-bg);color:var(--warn)} .b-warn i{background:var(--warn)}
  .prov{font-family:var(--f-mono);font-size:10px;letter-spacing:.02em;text-transform:uppercase;padding:2px 6px;border-radius:5px;background:var(--muted-bg);color:var(--ink-3);border:1px solid var(--line)}
  .inuse{font-family:var(--f-mono);font-size:12px;color:var(--ink-2)}
  .inuse.zero{color:var(--ink-3)}

  .catbar{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
  .cat{border:1px solid var(--line);background:var(--surface);color:var(--ink-2);padding:6px 11px;border-radius:20px;font-size:12.5px;font-weight:500;display:inline-flex;gap:7px;align-items:center}
  .cat .n{font-family:var(--f-mono);font-size:10.5px;color:var(--ink-3)}
  .cat:hover{border-color:var(--accent)}
  .cat.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .cat.on .n{color:rgba(255,255,255,.8)}

  /* drawer */
  .scrim{position:fixed;inset:0;background:rgba(16,26,22,.42);opacity:0;pointer-events:none;transition:opacity .18s;z-index:40}
  .scrim.on{opacity:1;pointer-events:auto}
  .drawer{position:fixed;top:0;right:0;height:100%;width:404px;max-width:92vw;background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--shadow-lg);transform:translateX(100%);transition:transform .2s cubic-bezier(.4,0,.2,1);z-index:41;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
  .drawer.on{transform:none}
  .drawer-head{display:flex;align-items:flex-start;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line-2)}
  .drawer-head .eyebrow{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--accent-ink)}
  .drawer-head h3{font-size:16px;margin-top:3px}
  .drawer-body{overflow-y:auto;flex:1;padding:18px;display:flex;flex-direction:column;gap:15px}
  .field label{display:block;font-size:11.5px;font-weight:600;color:var(--ink-2);margin-bottom:5px;letter-spacing:.01em}
  .field input,.field select,.field textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);color:var(--ink);font-size:13px;font-family:inherit}
  .field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--accent-weak);border-color:var(--accent);background:var(--surface)}
  .field .hint{font-size:11px;color:var(--ink-3);margin-top:4px}
  .field.mono input{font-family:var(--f-mono)}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .switch{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 13px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2)}
  .switch .tx b{font-size:13px} .switch .tx p{margin:1px 0 0;font-size:11.5px;color:var(--ink-3)}
  .tog{width:38px;height:22px;border-radius:20px;background:var(--line);border:0;position:relative;flex:none;transition:background .15s}
  .tog::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
  .tog.on{background:var(--accent)} .tog.on::after{transform:translateX(16px)}
  .drawer-foot{border-top:1px solid var(--line-2);padding:13px 18px;display:flex;flex-direction:column;gap:10px}
  .audit-line{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--ink-3);font-family:var(--f-mono)}
  .audit-line svg{width:13px;height:13px}
  .foot-btns{display:flex;gap:8px}
  .foot-btns .btn{flex:1;justify-content:center}
  .danger{color:var(--bad);border-color:transparent;background:transparent}
  .danger:hover{background:var(--bad-bg)}

  /* milestone items */
  .mitems{display:flex;flex-direction:column;gap:8px}
  .mitem{display:grid;grid-template-columns:22px 1fr 92px;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--surface-2)}
  .mitem .k{width:22px;height:22px;border-radius:6px;background:var(--accent-weak);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-mono);font-size:11px;font-weight:600}
  .mitem b{font-size:13px} .mitem .kind{font-family:var(--f-mono);font-size:10.5px;color:var(--ink-3)}
  .mitem .off{font-family:var(--f-mono);font-size:12px;color:var(--ink-2);text-align:right}

  /* org settings */
  .settings{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .fieldset{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
  .fieldset>h4{font-size:13px;padding:13px 16px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;gap:8px}
  .fieldset .fs-body{padding:16px;display:flex;flex-direction:column;gap:13px}
  .locked{position:relative}
  .locked .fs-body{filter:blur(3px);opacity:.5;pointer-events:none;user-select:none}
  .lock-note{position:absolute;inset:38px 0 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:20px}
  .lock-note svg{width:22px;height:22px;color:var(--ink-3)}
  .lock-note b{font-size:13px}
  .lock-note span{font-size:12px;color:var(--ink-2);max-width:34ch}

  .placeholder{text-align:center;padding:60px 24px;border:1px dashed var(--line);border-radius:var(--r);background:var(--surface-2)}
  .placeholder .ic{width:44px;height:44px;border-radius:11px;background:var(--muted-bg);color:var(--ink-2);display:grid;place-items:center;margin:0 auto 14px}
  .placeholder .ic svg{width:22px;height:22px}
  .placeholder h3{font-size:16px}
  .placeholder p{color:var(--ink-2);max-width:44ch;margin:8px auto 0;font-size:13px}
  .placeholder .phase{display:inline-block;margin-top:14px;font-family:var(--f-mono);font-size:11px;color:var(--accent-ink);background:var(--accent-weak);padding:4px 10px;border-radius:20px}

  .hint-strip{display:flex;gap:9px;align-items:flex-start;background:var(--surface-2);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:8px;padding:11px 13px;font-size:12.5px;color:var(--ink-2);margin-bottom:16px}
  .hint-strip svg{width:15px;height:15px;color:var(--accent-ink);flex:none;margin-top:1px}

  @media (max-width:920px){
    .app{grid-template-columns:1fr}
    .rail{position:fixed;top:0;left:0;bottom:0;width:246px;z-index:50;transform:translateX(-100%);transition:transform .2s}
    .rail.on{transform:none}
    .hamb{display:inline-flex}
    .cols-4{grid-template-columns:repeat(2,1fr)}
    .cols-2{grid-template-columns:1fr}
    .sec-cards{grid-template-columns:1fr 1fr}
    .settings{grid-template-columns:1fr}
  }
  @media (max-width:560px){
    .cols-4{grid-template-columns:1fr 1fr}
    .sec-cards{grid-template-columns:1fr}
    .search input{width:140px}
    .wrap{padding-left:16px;padding-right:16px}
    .head-actions .cap{display:none}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">
  <aside class="rail" id="rail">
    <div class="brand">

      <div style="display:flex;flex-direction:column;gap:14px">
        <div class="fieldset">
          <h4>${svg('doc',15)} Document defaults</h4>
          <div class="fs-body">
            ${fieldSel('Default currency',['GBP — £','EUR — €','AED — د.إ'])}
            ${fieldSel('Default payment terms',['30 days','14 days','60 days','On receipt'])}
            ${fieldArea('Report footer','Net Zero International Ltd · Registered in England 09847221 · netzero.international')}
          </div>
        </div>
        <div class="fieldset locked">
          <h4>${svg('lock',15)} Bank details</h4>
          <div class="fs-body">
            ${field('Account name','••••••••')}
            <div class="row2">${field('Sort code','••-••-••',1)}${field('Account no.','••••••••',1)}</div>
          </div>
          <div class="lock-note">${svg('lock',22)}<b>Restricted to Admin + Finance</b><span>Bank details appear on invoices. Editing needs the Finance capability, and they are never exposed on a public endpoint.</span></div>
        </div>
      </div>
    </div>`;
}
function field(l,v,half){return `<div class="field${half?' mono':''}"><label>${l}</label><input value="${v}"></div>`;}
function fieldArea(l,v){return `<div class="field"><label>${l}</label><textarea rows="3">${v.replace(/\\n/g,'\n')}</textarea></div>`;}
function fieldSel(l,opts){return `<div class="field"><label>${l}</label><select>${opts.map(o=>`<option>${o}</option>`).join('')}</select></div>`;}

function viewPlaceholder(v){
  el('view').innerHTML=`
    <div class="page-head"><div><div class="eyebrow">${groupOf(v)}</div><h1>${LABELS[v]}</h1></div></div>
    <div class="placeholder">
      <div class="ic">${svg(iconOf(v),22)}</div>
      <h3>${LABELS[v]}</h3>
      <p>${PH_DESC[v]||'This admin area follows the same list, edit and audit pattern shown in Lookups and Job types.'}</p>
      <span class="phase">Roadmap · Phase ${PHASE[v]||'—'}</span>
    </div>`;
}
const PH_DESC={
  team:'Staff records, role assignment against the versioned capability matrix, and deactivation — replacing today’s command-line-only path.',
  filetypes:'The job file-type vocabulary and its storage mapping, with two protected system types that cannot be removed.',
  tax:'VAT rates (typed %, one default), currencies (code, symbol, rate) and payment terms — the typed lookups behind quotes and invoices.',
  catalogue:'The service catalogue of billable items — code, unit, default hours, cost and sell price, VAT — reused by quotes, invoices and job lines.',
  suppliers:'Subcontractors and their rate card. Contact details are sealed as third-party personal data.',
  messages:'Email and notification templates with subject and body, previewed before they are used for invites, quotes and reminders.',
  reports:'Report templates, their variables and versions, assignable per client.',
  crm:'Pipeline stages, service lines, tags and automation rules for business development.',
  factors:'The emission-factor library — already imported — gains curation, dataset archiving and factor-variant management.',
  custom:'Reusable global custom factors, reconciled with the per-client factors that already exist.',
  methodology:'Country and scope methodology rows, reconciled against the console’s input specification.',
};
function groupOf(v){let g='';NAV.forEach(x=>{if(x.items.some(i=>i.id===v))g=x.group||'Administration';});return g;}
function iconOf(v){let ic='sliders';NAV.forEach(x=>x.items.forEach(i=>{if(i.id===v)ic=i.icon;}));return ic;}

/* ---------- drawer ---------- */
function drawer(html){el('drawer').innerHTML=html;el('drawer').classList.add('on');el('drawer').setAttribute('aria-hidden','false');el('scrim').classList.add('on');
  el('drawer').querySelectorAll('[data-close]').forEach(b=>b.onclick=closeDrawer);
  el('drawer').querySelectorAll('.tog').forEach(t=>t.onclick=()=>t.classList.toggle('on'));
}
function closeDrawer(){el('drawer').classList.remove('on');el('drawer').setAttribute('aria-hidden','true');el('scrim').classList.remove('on');}
el('scrim').onclick=closeDrawer;

const footAudit=(v,who)=>`<div class="drawer-foot"><div class="audit-line">${svg('shield',13)} Every change is recorded in the audit log · ${v}</div><div class="foot-btns"><button class="btn" data-close>Cancel</button><button class="btn pri" data-close>${svg('check',15)} Save</button></div></div>`;

function openLookup(r,cat,hasCode){
  const isNew=!r;
  drawer(`
    <div class="drawer-head"><div><div class="eyebrow">${cat}</div><h3>${isNew?'New value':r.name}</h3></div><button class="icon-btn" data-close aria-label="Close"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="drawer-body">
      <div class="field"><label>Label</label><input value="${isNew?'':r.name}" placeholder="e.g. Professional services"><div class="hint">Shown in pickers and on records.</div></div>
      ${hasCode?`<div class="field mono"><label>Code</label><input value="${isNew?'':(r.code||'')}" placeholder="Optional short code"></div>`:''}
      <div class="row2"><div class="field mono"><label>Sort order</label><input value="${isNew?'':r.sort}"></div>
      <div class="field"><label>Source</label><input value="${isNew?'Added here':PROVLABEL[r.prov]}" disabled style="color:var(--ink-3)"></div></div>
      <div class="switch"><div class="tx"><b>Active</b><p>Inactive values leave the pickers but still show on existing records.</p></div><button class="tog ${isNew||r.active?'on':''}" aria-label="Active"></button></div>
      ${!isNew&&r.use>0?`<div class="hint-strip">${svg('info',15)}<div>In use on <b>${r.use}</b> record${r.use>1?'s':''}. Deactivating keeps it resolved on those; it cannot be deleted.</div></div>`:''}
    </div>
    ${isNew?footAudit('new'):`<div class="drawer-foot"><div class="audit-line">${svg('shield',13)} Recorded in the audit log · v${(r.use%4)+2}</div><div class="foot-btns"><button class="btn ${r.active?'danger':''}" data-close>${r.active?svg('archive',15)+' Deactivate':svg('check',15)+' Reinstate'}</button><button class="btn pri" data-close>${svg('check',15)} Save</button></div></div>`}
  `);
}
function openJobType(r){
  const isNew=!r;
  drawer(`
    <div class="drawer-head"><div><div class="eyebrow">Job type</div><h3>${isNew?'New job type':r.name}</h3></div><button class="icon-btn" data-close aria-label="Close"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="drawer-body">
      <div class="field"><label>Name</label><input value="${isNew?'':r.name}"></div>
      <div class="row2"><div class="field mono"><label>Code</label><input value="${isNew?'':r.code}"></div>
      <div class="field"><label>Family</label><select><option ${r&&r.family==='Carbon reporting'?'selected':''}>Carbon reporting</option><option ${r&&r.family==='Advisory'?'selected':''}>Advisory</option><option ${r&&r.family==='LCA'?'selected':''}>LCA</option><option ${r&&r.family==='Training'?'selected':''}>Training</option></select></div></div>
      <div class="row2"><div class="field mono"><label>Default price (ex VAT)</label><input value="${isNew?'':r.price}"></div>
      <div class="field mono"><label>Estimated hours</label><input value="${isNew?'':r.hours}"></div></div>
      <div class="row2"><div class="field"><label>VAT rate</label><select><option>Standard — 20%</option><option>Reduced — 5%</option><option>Zero — 0%</option></select></div>
      <div class="field"><label>Milestone template</label><select><option>Standard CRP</option><option>Express CRP</option><option>LCA delivery</option><option>None</option></select></div></div>
      <div class="switch"><div class="tx"><b>Active</b><p>Available when creating a new job.</p></div><button class="tog ${isNew||r.active?'on':''}"></button></div>
    </div>
    ${footAudit(isNew?'new':'v'+((r.hours%3)+2))}
  `);
}
function openMilestone(t){
  const isNew=!t;
  drawer(`
    <div class="drawer-head"><div><div class="eyebrow">Milestone template</div><h3>${isNew?'New template':t.name}</h3></div><button class="icon-btn" data-close aria-label="Close"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="drawer-body">
      <div class="field"><label>Template name</label><input value="${isNew?'':t.name}"></div>
      <div class="switch"><div class="tx"><b>Default template</b><p>New jobs use this unless their job type sets another.</p></div><button class="tog ${t&&t.def?'on':''}"></button></div>
      <div>
        <label style="display:block;font-size:11.5px;font-weight:600;color:var(--ink-2);margin-bottom:7px">Milestones · offset from job start</label>
        <div class="mitems">${(t?t.items:[{k:'DC',kind:'data_collection',name:'Data collection',off:14},{k:'FD',kind:'first_draft',name:'First draft',off:35},{k:'FR',kind:'final_report',name:'Final report',off:56}]).map(m=>`
          <div class="mitem"><span class="k">${m.k}</span><div><b>${m.name}</b><div class="kind">${m.kind}</div></div><div class="off">+${m.off}d</div></div>`).join('')}
        </div>
        <div class="hint" style="font-size:11px;color:var(--ink-3);margin-top:8px">The three kinds map to the Risk rule. Each carries its own due offset.</div>
      </div>
      <div class="field"><label>Linked job types</label><input value="${isNew?'':(t.jobtypes.join(', ')||'None')}"></div>
    </div>
    ${footAudit(isNew?'new':'v2')}
  `);
}

/* ---------- chrome ---------- */
function bindCards(){el('view').querySelectorAll('.sec-card[data-view]').forEach(b=>b.onclick=()=>go(b.dataset.view));}
el('hamb').onclick=()=>el('rail').classList.toggle('on');
el('theme').onclick=()=>{const r=document.documentElement;const dark=r.getAttribute('data-theme')==='dark'||(!r.getAttribute('data-theme')&&matchMedia('(prefers-color-scheme:dark)').matches);r.setAttribute('data-theme',dark?'light':'dark');};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer();});

renderNav();crumb();renderView();
</script>
