services:
  - type: web
    name: nzi-console
    runtime: node
    region: frankfurt
    plan: starter
    branch: main
    # Build from the monorepo root so workspace packages (@nzi/ui, @nzi/mock-data) resolve.
    buildCommand: npm install && npm run build -w @nzi/console
    startCommand: npm run start -w @nzi/console
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NEXT_PUBLIC_APP_ENV
        value: staging
      # Data-entry redesign flags (NZC-035/036/041/043/046).
      #
      # THIS FILE IS NOT READ FOR THIS SERVICE. nzi-console and the reminder worker
      # were created by hand, not from a Blueprint, so Render never applies anything
      # here — the Render dashboard is the effective source of truth, and a change to
      # this file does nothing to the running build. It is documentation, and the
      # carrier for a future Blueprint rebuild (NZC-079). Reconciled against the
      # dashboard on 16 Sep 2026: docs/CONFIG_DRIFT_REPORT.md.
      #
      # A flip is therefore a dashboard edit + Clear build cache & deploy, per
      # docs/DEPLOYMENT.md §"Feature-flag flips" — NEXT_PUBLIC_* is inlined at
      # `next build`, so the dashboard value at build time is what ships in the bundle.
      # Update the value here in the same PR, so the two do not drift again.
      #   spend            B2 ledger adapter (STAGING_ACCEPTANCE_B2.md)
      #   spend-import     B4 CSV bulk import (STAGING_ACCEPTANCE_B4.md)
      #   portal-spend     B5 portal spend mirror (STAGING_ACCEPTANCE_B5.md)
      #   commuting/vehicle S1 source-register bulk (STAGING_ACCEPTANCE_S1.md)
      #   travel           Business Travel per-entity roll-up — data-entry UX
      #                    review item 5 (ACCEPTANCE_DATA_ENTRY_UX_REVIEW.md);
      #                    migration 0057 must be live on staging first
      #   client-factors   S2 client-factor lifecycle (STAGING_ACCEPTANCE_S2.md)
      #   data-entry-accordion  UX1 one data-entry UX (STAGING_ACCEPTANCE_UX1.md)
      #   job-stage-sections    UX1e-1 stage-as-section CRP workspace
      #                         (ACCEPTANCE_UX1E_STAGE_SECTIONS.md) — for the e1
      #                         acceptance run; roll back if the human pass fails
      - key: NEXT_PUBLIC_FEATURE_DATA_ENTRY_V2
        value: spend,spend-import,portal-spend,commuting,vehicle,travel,client-factors,data-entry-accordion,job-stage-sections,data-assurance,entry-lean-capture,data-entry-fast-add
      # Report Studio (R-track) flags — own variable, build-inlined, flipped via
      # the Render dashboard + rebuild (see docs/DEPLOYMENT.md). Kept here for
      # continuity only. R1/R3/R4/R5 are live on isolated staging.
      # (docs/STAGING_ACCEPTANCE_R1.md).
      - key: NEXT_PUBLIC_FEATURE_REPORT_STUDIO
        value: report-svg-charts,report-tokens,report-edit,report-paged
      # Job-family modules (Track C, NZC-024) — own variable, same dashboard-edit-
      # plus-rebuild procedure. job-module-lca (slices 1–2) has a seed LCA/PCF job
      # to see it against as of 5 Sep 2026 (docs/ACCEPTANCE_LCA_MODULE_SLICE2.md) —
      # continuity value here; the dashboard flip is still a manual step.
      - key: NEXT_PUBLIC_FEATURE_JOB_MODULES
        value: job-module-lca
      # Client portal Phase 2 (apps/console/app/lib/portalFlags.ts). Live in the dashboard
      # and previously missing from this file entirely — added 16 Sep 2026 so the two agree.
      #   portal-analytics  the emissions dashboard + /portal/intensity
      #   portal-actions    the qualitative action tracker on the job dashboard
      # NOTE: the portal reduction plan (#173) and readiness statement (#177) are NOT behind
      # either token — they render unconditionally. See docs/CONFIG_DRIFT_REPORT.md §4.
      - key: NEXT_PUBLIC_FEATURE_PORTAL
        value: portal-analytics,portal-actions
      - key: NZI_DATA_MODE
        value: isolated-api
      - key: NZI_DATABASE_BOUNDARY
        value: isolated-non-production
      - key: NZI_DEMO_ORGANISATION_ID
        value: demo-nzi-console
      - key: NZI_ISOLATED_API_URL
        value: https://nzi-pro-api-prod.onrender.com
      # Non-production Supabase only — never commit this value.
      - key: NZI_ISOLATED_DATABASE_URL
        sync: false
      # Reconciled to the live dashboard values, 16 Sep 2026 — /api/health reports
      # authentication enabled and required, and this file previously said "false".
      #
      # WHETHER THAT IS INTENDED IS UNCONFIRMED. It may be deliberate, or inherited from
      # the recycled service this one was created on. These values are recorded here to
      # stop the file lying about the running state; the live values were NOT changed and
      # must not be, on this evidence alone. Confirm the intent before either is touched —
      # and note NZI_JWT_SECRET is plausibly load-bearing for the auth these enable
      # (docs/CONFIG_DRIFT_REPORT.md §5).
      - key: NZI_AUTH_ENABLED
        value: "true"
      - key: NZI_AUTH_REQUIRED
        value: "true"
      - key: NZI_CONSOLE_SESSION_SECRET
        sync: false
      - key: NZI_CONSOLE_MFA_ENCRYPTION_KEY
        sync: false

  # ── Reminder worker ────────────────────────────────────────────────────────────────
  # Drains nzi_console.transactional_outbox on a clock and sends reduction-strategy
  # deadline reminders. A separate service because a tick driven by web traffic fires
  # whenever someone happens to be looking, which is neither a schedule nor idempotent.
  #
  # ON THIS SERVICE IT SENDS NOTHING. NZI_DATABASE_BOUNDARY=isolated-non-production makes
  # mailDelivery() return "suppress" before either of the other two conditions is read, so
  # the worker composes each reminder, records it in strategy_automation_log, and logs the
  # mail it would have sent. That is the isolation rule, not a limitation to work around:
  # staging must never email a real client.
  #
  # Real sending needs a non-isolated boundary AND NEXT_PUBLIC_APP_ENV=production AND
  # NZI_MAIL_MODE=send. All three, and the default of every one of them is silence.
  - type: worker
    name: nzi-console-reminders
    runtime: node
    region: frankfurt
    plan: starter
    branch: main
    # The worker runs TypeScript through tsx, so tsx is a runtime dependency of
    # @nzi/isolated-backend rather than a dev one — Render sets NODE_ENV=production, which
    # would otherwise skip it and the service would fail to start.
    buildCommand: npm install
    startCommand: npm run reminder-worker -w @nzi/isolated-backend
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NEXT_PUBLIC_APP_ENV
        value: staging
      - key: NZI_DATABASE_BOUNDARY
        value: isolated-non-production
      - key: NZI_DEMO_ORGANISATION_ID
        value: demo-nzi-console
      # Same non-production Supabase as the console. Never commit this value.
      - key: NZI_ISOLATED_DATABASE_URL
        sync: false
      # How often the clock ticks. Reminders are day-grained, so this only controls how
      # promptly a newly-due date is noticed, not how often anyone is written to —
      # strategy_automation_log's unique index is what stops a second send.
      - key: NZI_REMINDER_TICK_SECONDS
        value: "900"
      # Deliberately ABSENT rather than set to a false-y value: mailDelivery() requires the
      # exact string "send", so an unset variable is the suppressing default. Adding it here
      # would be the one edit that could put mail on the wire, and it must never be made on
      # this service.
      #   - key: NZI_MAIL_MODE
      #     value: send
      #
      # SMTP transport (Office 365), matching live. Values are supplied per service in the
      # Render dashboard and never committed. The worker reads this contract but, on this
      # service, never opens a connection — the suppressing mailer is chosen before any
      # transport is built, so these may be left unset here entirely.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMTP_TLS
        sync: false
