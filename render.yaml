services:
  - type: web
    name: nzi-console
    runtime: node
    region: frankfurt
    plan: starter
    branch: main
    # Build from the monorepo root so workspace packages (@nzi/ui, @nzi/mock-data) resolve.
    buildCommand: npm install && npm run build -w @nzi/console
    startCommand: npm run start -w @nzi/console
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NEXT_PUBLIC_APP_ENV
        value: staging
      # Data-entry redesign flags (NZC-035/036/041/043/046). Gated rollout:
      # render.yaml is the single source of truth (docs/REDESIGN_ROLLOUT.md
      # §"Feature-flag strategy"), so every flip is a reviewed, source-controlled
      # change. NEXT_PUBLIC_* is inlined at `next build`, so a change here forces
      # a rebuild with the new set baked into the client bundle.
      #   spend            B2 ledger adapter (STAGING_ACCEPTANCE_B2.md)
      #   spend-import     B4 CSV bulk import (STAGING_ACCEPTANCE_B4.md)
      #   portal-spend     B5 portal spend mirror (STAGING_ACCEPTANCE_B5.md)
      #   commuting/vehicle S1 source-register bulk (STAGING_ACCEPTANCE_S1.md)
      #   client-factors   S2 client-factor lifecycle (STAGING_ACCEPTANCE_S2.md)
      #   data-entry-accordion  UX1 one data-entry UX (STAGING_ACCEPTANCE_UX1.md)
      #   job-stage-sections    UX1e-1 stage-as-section CRP workspace
      #                         (ACCEPTANCE_UX1E_STAGE_SECTIONS.md) — for the e1
      #                         acceptance run; roll back if the human pass fails
      - key: NEXT_PUBLIC_FEATURE_DATA_ENTRY_V2
        value: spend,spend-import,portal-spend,commuting,vehicle,client-factors,data-entry-accordion,job-stage-sections
      - key: NZI_DATA_MODE
        value: isolated-api
      - key: NZI_DATABASE_BOUNDARY
        value: isolated-non-production
      - key: NZI_DEMO_ORGANISATION_ID
        value: demo-nzi-console
      - key: NZI_ISOLATED_API_URL
        value: https://nzi-pro-api-prod.onrender.com
      # Non-production Supabase only — never commit this value.
      - key: NZI_ISOLATED_DATABASE_URL
        sync: false
      - key: NZI_AUTH_ENABLED
        value: "false"
      - key: NZI_AUTH_REQUIRED
        value: "false"
      - key: NZI_CONSOLE_SESSION_SECRET
        sync: false
      - key: NZI_CONSOLE_MFA_ENCRYPTION_KEY
        sync: false
