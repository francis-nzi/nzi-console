services:
  - type: web
    name: nzi-console
    runtime: node
    region: frankfurt
    plan: starter
    branch: main
    # Build from the monorepo root so workspace packages (@nzi/ui, @nzi/mock-data) resolve.
    buildCommand: npm install && npm run build -w @nzi/console
    startCommand: npm run start -w @nzi/console
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NEXT_PUBLIC_APP_ENV
        value: staging
      - key: NZI_DATA_MODE
        value: isolated-api
      - key: NZI_DATABASE_BOUNDARY
        value: isolated-non-production
      - key: NZI_DEMO_ORGANISATION_ID
        value: demo-nzi-console
      - key: NZI_ISOLATED_API_URL
        value: https://nzi-pro-api-prod.onrender.com
      # Non-production Supabase only — never commit this value.
      - key: NZI_ISOLATED_DATABASE_URL
        sync: false
      - key: NZI_AUTH_ENABLED
        value: "false"
      - key: NZI_AUTH_REQUIRED
        value: "false"
      - key: NZI_CONSOLE_SESSION_SECRET
        sync: false
      - key: NZI_CONSOLE_MFA_ENCRYPTION_KEY
        sync: false
