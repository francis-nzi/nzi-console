# CI for nzi-console.
#
# The repository had none until now, which is why a migration could be merged, never
# applied, and edited afterwards without anything noticing. The job that matters most here
# is `migrations`: it applies every migration in order against a real Postgres, which is the
# only check that can catch a file that parses as text but fails as SQL.
#
# The pattern worth noticing across both jobs: the checks that have earned their place here are
# the ones answering a question the unit tests structurally cannot. `migrations` asks whether the
# SQL runs; `check:conflicts` asks whether the files are intact. Everything else asks whether the
# code works, and a corrupted document answers that with a confident yes.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# One run per branch. Nothing cancelled a superseded run, so a push onto a branch whose previous run
# was stuck left both going: the old one grinding towards the six-hour default while the new one
# queued behind it, and the pull request showing an in-progress check that belonged to neither head.
#
# Never on main, though. A superseded pull-request run is noise; a superseded main run is the record
# of what was actually proven about the commit that shipped.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    name: typecheck · build · tests
    runs-on: ubuntu-latest
    # It finishes in about a minute. Anything approaching this is stuck, not slow.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # First, and deliberately so. This is the only check here that looks at the files rather
      # than at what they compile to — a committed conflict marker in Markdown passes typecheck,
      # build and every test, which is exactly how one reached a PR on #194 (NZC-086). It costs
      # a second and it fails fast.
      - run: npm run check:conflicts
      - run: npm run check:decisions
      # A day is not an instant. Two defects shipped on that confusion (NZC-096, NZC-105) and
      # both compiled, passed review and passed every test that did not happen to run in BST.
      # This one reads the expression rather than its result, which is the only way to catch
      # the next copy before it is written (NZC-106).
      - run: npm run check:dates
      - run: npm run check:terminology
      # A migration on main is frozen — the ledger's checksum is over the whole file, so even a comment
      # breaks the next deploy. That has now happened three times, most recently on #263/#264: a comment
      # improved on an already-applied 0110, and staging refused to deploy until the bytes were restored.
      #
      # The fetch is not optional and it is not a formality. `actions/checkout` clones shallow, without
      # `origin/main`, and a gate with nothing to compare against would pass everything — so the script
      # treats an unresolvable base as a failure rather than a skip, and this step is what stops that
      # failure from being how everybody finds out.
      - name: Fetch main, which the frozen-migration gate compares against
        run: git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main
      - run: npm run check:migrations-frozen
      - run: npm run typecheck
      - run: npm run build
      - run: npm test -w @nzi/contracts
      - run: npm test -w @nzi/isolated-backend
      # The chart renderers. They were green but unenforced: nothing in CI ran them, so a
      # broken SVG would have reached a client-facing report unnoticed.
      - run: npm test -w @nzi/charts
      - run: npm run test:console

  migrations:
    name: migrations apply to a real Postgres
    runs-on: ubuntu-latest
    # The default is six hours, which is how a hang came to look like a slow pass for fourteen minutes
    # and would have for a great deal longer. This job builds a database per suite and normally takes
    # a few minutes; a quarter of an hour is generous and still fails while somebody is watching.
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nzi_migrations_ci
        ports: ["5432:5432"]
        # Without this the steps can start before Postgres is accepting connections, and the
        # job fails for a reason that has nothing to do with the migrations.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # A throwaway database, recreated per run. Never a real one: the guard in the runner
      # refuses anything but the isolated non-production boundary, and this is not that.
      NZI_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/nzi_migrations_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Sealing keys for this run, minted here and thrown away with it (NZC-119).
      #
      # Writing personal data seals it, and an unset key **refuses the write** rather than skipping it —
      # skipping is the hole that work exists to close, so this job failing without keys was the guard
      # doing its job rather than a defect. The suites below write personal data, so they need keys.
      #
      # Fresh random ones per run, never committed values and never the real ones: this repository is
      # public, and the Postgres this job talks to is created and dropped inside the run. Every seal and
      # every read-back happens within that window, so a key that exists only for the run is both safer
      # than a fixture and sufficient. `GITHUB_ENV` so that one set is shared by every step, rather than
      # each step minting its own and a later suite being unable to read what an earlier one sealed.
      #
      # 32 bytes base64 is what `subjectCrypto` requires, and openssl wraps at 64 characters, so 44
      # characters stay on one line — which is what `GITHUB_ENV` can carry.
      - name: Mint throwaway sealing keys for this run
        run: |
          {
            echo "NZI_SUBJECT_MASTER_KEY=$(openssl rand -base64 32)"
            echo "NZI_SUBJECT_INDEX_KEY=$(openssl rand -base64 32)"
            echo "NZI_SUBJECT_LINKAGE_KEY=$(openssl rand -base64 32)"
          } >> "$GITHUB_ENV"
      - name: Apply every migration in order
        run: npx tsx --test packages/isolated-backend/tests/migrationsRun.test.ts
      # The standing invariant: no row holds personal data without ciphertext beside it. It has to run
      # here, because it is the only place with a real Postgres — and a check that never executes is the
      # same thing as a check that cannot fail.
      - name: Personal data has ciphertext beside it
        run: npx tsx --test packages/isolated-backend/tests/piiEncryptionCoverage.test.ts
      # The keystone property of an issued report: it does not move when its sources do.
      # Needs a real database, so it runs in this job rather than the unit suite.
      - name: An issued report does not move
        run: npx tsx --test packages/isolated-backend/tests/reportFreeze.test.ts
      # ── The proofs that were passing locally and proving nothing in CI ──────────────────
      #
      # Each of these existed, was green for whoever had a local Postgres, and was not run by the only
      # job that has one. They are the guarantees most worth guarding, so they go first: what the
      # database refuses, who a person is, what the linker may correlate, what an issued artefact
      # carries, and which period a template belongs to.
      #
      # A red here is more likely a regression that has been sitting unnoticed than a break introduced
      # by wiring the step up. Triage it as the former first.
      #
      # Tenancy is enforced by policy, not by remembering a WHERE clause — which can only be shown by
      # becoming the role and watching the database refuse.
      - name: The database enforces tenant isolation
        run: npx tsx --test packages/isolated-backend/tests/tenantIsolationReal.test.ts
      # Who a person is, and the privileged cross-tenant read that is the review queue's whole
      # contract. A SECURITY DEFINER function's return list is only a boundary if something runs it.
      - name: The subject registry, and its privileged read
        run: npx tsx --test packages/isolated-backend/tests/dataSubjectRegistry.test.ts
      # The linkage digest is confined by a grant and a function rather than by a policy, and a grant
      # that is never exercised is a comment. This is the suite that exercises it.
      - name: The linkage digest stays confined
        run: npx tsx --test packages/isolated-backend/tests/subjectLinkage.test.ts
      # What an issued snapshot carries. The assertion is negative — that a personal identifier is
      # absent — and a negative over a fixture nobody built is satisfied by an empty database.
      - name: An issued snapshot carries no asset identifier
        run: npx tsx --test packages/isolated-backend/tests/snapshotOmitsAssetIdentifier.test.ts
      # The pairing that a live BST outage was made of: the template's period and the job's period are
      # one invariant, and it is only checkable where a zone can actually shift a day.
      - name: A spend template's period equals its job's period
        run: npx tsx --test packages/isolated-backend/tests/spendImportPeriodPairing.test.ts
      # Public certificate verification, which is live, user-facing and had no database test at all
      # until now. It is also one of the two reads that cross a tenant boundary on purpose, so before
      # 0104 a test of it would have proved nothing: the property was switched off underneath it.
      - name: A stranger can verify a certificate, and see only the contract
        run: npx tsx --test packages/isolated-backend/tests/certificateVerificationReal.test.ts
      # The shared read under both the subject access export and erasure. What it reaches decides what
      # either can claim, so it is checked against a real schema rather than a fake pool.
      - name: Everything belonging to one person, resolved once
        run: npx tsx --test packages/isolated-backend/tests/subjectResolutionReal.test.ts
      # Idempotency is a property of a unique index and a claim taken before a send, so it
      # is only really tested against a database that can refuse the second one.
      - name: Reminders send once, and the outbox backlog sends nothing
        run: npx tsx --test packages/isolated-backend/tests/strategyReminders.test.ts
      # The NZC-080 acceptance seed, run twice. Its first three failures were each found by
      # running it against staging, which cost a round-trip apiece and left a half-applied
      # fixture in a real client's plan. Two were invisible to typecheck by construction and one
      # was a runtime-only rule, so only executing the commands against a database catches them.
      - name: The portal acceptance seed runs end to end, and is re-runnable
        run: npx tsx --test packages/isolated-backend/tests/portalAcceptanceSeed.test.ts
      # The staff portal preview, against the contract the page serves it under. Thirteen unit
      # tests passed while the screen could not render at all, because the fault was in the join
      # between the response and its contract — a place no test of a part can see.
      - name: The portal preview satisfies its screen contract
        run: npx tsx --test packages/isolated-backend/tests/portalPreviewContract.test.ts
      # The reference-data import (NZC-089), held to §14: run twice, and once over a dirtied
      # database. The lists come from a live export, so a second import is routine — a corrected
      # file, an edited list, a later loader — and every one arrives as state the first run left.
      - name: The reference-data import is idempotent and converges
        run: npx tsx --test packages/isolated-backend/tests/referenceDataImport.test.ts
      # The subject access response (NZC-134, NZC-135). Two things can only be proved against real
      # policies: that every inventory column is accounted for by a traversal that actually ran, and
      # that a delivered or lapsed artifact is genuinely unreadable afterwards.
      - name: A subject access export is complete, and its window closes
        run: npx tsx --test packages/isolated-backend/tests/subjectExportReal.test.ts
      # Erasure (NZC-136, NZC-137). The irreversibility proof only means anything against real policies
      # and real grants: that a correct guess at an erased address matches no blind index and no linkage
      # digest, and that the append-only claim the manifest rests on agrees with the actual privileges.
      - name: An erasure leaves nothing on any path, and says what it could not finish
        run: npx tsx --test packages/isolated-backend/tests/subjectErasureReal.test.ts
      # Trainee self-service, which has never been run against a real Postgres. The suite exists to
      # find out whether the authentication context can reach a trainee row at all under forced RLS, and
      # it can only answer that here — in the unit job it skips, which is not an answer.
      - name: Trainee self-service, against the policies that govern it
        run: npx tsx --test packages/isolated-backend/tests/traineeSelfServiceReal.test.ts
      # The live emissions aggregation (NZC-143, NZC-144). The location rule is only meaningful against
      # real rows and real constraints: that a market row contributes 0 to every tier while still reading
      # its value, that an identical location row proves the rule bites, and that 0109 refuses to let a
      # row which counts be hidden.
      - name: Emissions totals exclude market and cannot hide a row that counts
        run: npx tsx --test packages/isolated-backend/tests/emissionsAggregationReal.test.ts
      # The category-variant registry (NZC-145). Two things only real Postgres can show: that a base is
      # recovered by splitting on the live registry rather than on a pattern — every seeded factor ends in
      # "-demo", which a naive parser reads as a variant — and that the permanence trigger refuses a rename
      # or a delete against the owner, which a grant would not have stopped.
      - name: A factor base is recovered by the registry, and a suffix is permanent
        run: npx tsx --test packages/isolated-backend/tests/factorCategoryVariantsReal.test.ts
      # Unit reconciliation (NZC-146). The assertions that decide whether this works are the refusals —
      # litres against a per-kilometre factor, a passenger-km against a vehicle-km, a unit nobody has
      # heard of — because a check that accepts everything passes every test about what it should accept.
      # Real Postgres is needed for the other half: that every unit the seeded spec declares is one the
      # checker recognises, since a declared unit it cannot read would refuse every entry for that field.
      - name: A unit reconciles with its factor, or the entry is refused
        run: npx tsx --test packages/isolated-backend/tests/unitCompatibilityReal.test.ts
      # The declared dataset mapping (NZC-149). Two things only a real database shows: that the rows 0112
      # seeds are shaped the way the resolver reads them — a mapping right in the abstract and mis-keyed
      # in the migration resolves nothing while every unit test stays green — and that the shape
      # constraint refuses. A CHECK is satisfied by NULL, which is how an earlier one came to admit every
      # row it was written to exclude, so each branch is given a row that should not exist.
      - name: A category reaches its factor by declared rule, or declines to the search
        run: npx tsx --test packages/isolated-backend/tests/datasetMappingReal.test.ts
      # The distribution-grain constraint (NZC-152), which said what it did not enforce: `false OR NULL`
      # is NULL, so a row claiming its months were derived while recording nothing about what from was
      # admitted. The refusals are paired with the rows that must still be accepted — a constraint that
      # refused everything would pass a refusal test and break capture.
      - name: A distributed row must say what it was distributed from
        run: npx tsx --test packages/isolated-backend/tests/distributionGrainReal.test.ts
      # Carrying the free-text client fields onto the references (NZC-090). The assertions that
      # matter are negative: an unmatched value is left alone, and an owner is never re-pointed.
      - name: The client reference backfill loses nothing
        run: npx tsx --test packages/isolated-backend/tests/clientReferenceBackfill.test.ts
      # Resolution against the real dry-run population: five naming variants and a junk value that
      # match nothing, and an archived industry that must still resolve for the clients that chose it.
      - name: Client references resolve, and fall back
        run: npx tsx --test packages/isolated-backend/tests/clientReferenceRead.test.ts

  # ── The fifth gate: the capture surface, in a browser, on this commit's build (NZC-147) ─────────────
  #
  # The four existing gates read source. This one runs the product. It exists because the drawer defect —
  # a detail drawer open at rest, describing a row nobody had chosen — lived entirely in the DOM lifecycle:
  # the unit test for the decision was correct and passing the whole time, because the fault was in a
  # caller that seeded the selection before the decision ran. Nothing that reads source could have found
  # it, and nothing did, for as long as it took somebody to look at the screen.
  #
  # It deliberately does **not** run `test:e2e`. That suite is rendered acceptance: it points at the
  # deployed staging service and signs in with real credentials, which makes it unfit as a gate twice over.
  # It tests what is deployed rather than what is proposed — a pull request's build is not on staging when
  # its checks run — and without `ACCEPTANCE_STAFF_*` its setup writes an empty state and annotates a skip,
  # so wiring it in here would have produced a permanently green check that executed nothing.
  capture-gate:
    name: the capture surface behaves, in a browser
    runs-on: ubuntu-latest
    # A build plus a browser run. Locally the suite itself takes thirteen seconds; the build dominates.
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nzi_capture_gate
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NZI_DATABASE_BOUNDARY: isolated-non-production
      NEXT_PUBLIC_APP_ENV: staging
      # `sslmode=disable` is load-bearing, not decoration. The migration runner connects with a hard-coded
      # `ssl: { rejectUnauthorized: false }` because the isolated database it normally talks to is Supabase,
      # which requires TLS. A plain `postgres:16` service refuses the SSL negotiation outright, and the run
      # dies with "The server does not support SSL connections" before applying anything. The connection
      # string is the supported way to say otherwise, and it is preferred here over making the runner's TLS
      # conditional: that script is on the deploy path, and this gate is not a reason to change how it
      # connects to staging.
      #
      # The `migrations` job does not need this because it applies migrations through the test harness,
      # which opens its own connections; this job runs `npm run migrate`, which is the real entry point.
      NZI_ISOLATED_DATABASE_URL: postgres://postgres:postgres@localhost:5432/nzi_capture_gate?sslmode=disable
      # The v2 capture surface is behind a build-time flag, and a `NEXT_PUBLIC_*` value is baked into the
      # bundle — so the gate must build with it on or it would browse the pre-v2 register and assert
      # nothing about the surface it is named after. Pinned here rather than read from the environment:
      # what staging has enabled lives in the Render dashboard and is not this gate's business. What this
      # proves is that the surface works when the flag is on.
      NEXT_PUBLIC_FEATURE_DATA_ENTRY_V2: data-entry-accordion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Throwaway secrets for this run, as the migrations job does. The session secret and the MFA key are
      # needed because capture is a write surface: the write routes resolve a staff principal, so the gate
      # provisions an account and mints a session against these. Sealing keys because writing personal
      # data refuses rather than skips without them.
      - name: Mint throwaway keys for this run
        run: |
          {
            echo "NZI_SUBJECT_MASTER_KEY=$(openssl rand -base64 32)"
            echo "NZI_SUBJECT_INDEX_KEY=$(openssl rand -base64 32)"
            echo "NZI_SUBJECT_LINKAGE_KEY=$(openssl rand -base64 32)"
            echo "NZI_CONSOLE_SESSION_SECRET=$(openssl rand -base64 32)"
            echo "NZI_CONSOLE_MFA_ENCRYPTION_KEY=$(openssl rand -base64 32)"
          } >> "$GITHUB_ENV"
      - name: Apply every migration in order
        run: npm run migrate
      # The synthetic demonstrator: the organisation and job (0001), its scope rows (0002), its factors
      # (0003) and its sites (0012). `ON_ERROR_STOP` because a seed that half-applied would leave the gate
      # asserting against a fixture nobody designed — and this is the step that would have caught 0002
      # becoming unrunnable, which it silently had.
      - name: Seed the synthetic capture fixture
        run: |
          for seed in 0001_synthetic_demo 0002_synthetic_crp_scope_rows 0003_synthetic_factors 0012_synthetic_capture_sites; do
            psql -v ON_ERROR_STOP=1 -q -f "packages/isolated-backend/seeds/$seed.sql" -d "$NZI_ISOLATED_DATABASE_URL"
          done
      # And then check that it did. `psql` will ignore options that follow a bare connection string —
      # which is how the first version of the step above applied no files at all, printed nothing, and
      # exited 0. The gate would then have run against an empty database and failed somewhere far from the
      # cause. `ON_ERROR_STOP` cannot help with that: there was no error, because there was no work.
      #
      # So the fixture is counted rather than assumed. These are the numbers the six browser tests are
      # written against: nine scope rows, four at Bristol, four at Leeds, one deliberately unallocated.
      - name: The fixture is actually there
        run: |
          set -euo pipefail
          count() { psql -tAX -c "$1" -d "$NZI_ISOLATED_DATABASE_URL"; }
          rows=$(count "select count(*) from nzi_console.job_scope_rows where job_id='712'")
          sites=$(count "select count(*) from nzi_console.client_sites")
          unplaced=$(count "select count(*) from nzi_console.job_scope_rows where job_id='712' and site_id is null")
          echo "scope rows=$rows sites=$sites unallocated=$unplaced"
          test "$rows" = "9" || { echo "expected 9 seeded scope rows, found $rows"; exit 1; }
          test "$sites" = "2" || { echo "expected 2 seeded sites, found $sites"; exit 1; }
          test "$unplaced" = "1" || { echo "expected exactly 1 unallocated row, found $unplaced"; exit 1; }
      - name: Install the browser the gate drives
        run: npx playwright install --with-deps chromium
      # The build, with its own output surfaced where it can be read.
      #
      # When this step failed on #269 the only thing outside the job log was "Process completed with exit
      # code 1" — and a job log needs an authenticated token to fetch, while annotations do not. So the
      # tail of a failing build is re-emitted as an `::error::` workflow command, which lands in the
      # annotations, and the whole log is kept as an artifact.
      #
      # This changes nothing about what the gate proves or what it will accept. It changes how long it
      # takes to find out why it refused, which on that run was the difference between a diagnosis and an
      # afternoon of elimination.
      - name: Build the console the gate will browse
        run: |
          set -o pipefail
          if ! npm run build -w @nzi/console 2>&1 | tee "$RUNNER_TEMP/console-build.log"; then
            # `paste -sd" " -` joins the lines: an annotation is single-line, and doing the join with
            # `tr` would need an escape sequence that has to survive YAML, a shell and a here-doc.
            tail -c 2500 "$RUNNER_TEMP/console-build.log" | paste -sd" " - | sed "s/::/ /g" > "$RUNNER_TEMP/tail.txt"
            echo "::error title=Console build failed::$(cat "$RUNNER_TEMP/tail.txt")"
            exit 1
          fi
      - name: Keep the build log of a failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: capture-gate-build-log
          path: ${{ runner.temp }}/console-build.log
          retention-days: 7
          if-no-files-found: ignore
      # The gate, and then the guard on the gate. `test:e2e:gate` runs both: Playwright exits 0 when every
      # test is skipped and when a stray `test.only` has narrowed the run to one case, so the result file
      # is read and the run is refused unless it actually executed the suite.
      - name: The capture lifecycle holds, and the gate actually ran
        run: npm run test:e2e:gate
      - name: Keep the traces of a failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: capture-gate-traces
          path: apps/console/test-results/
          retention-days: 7
