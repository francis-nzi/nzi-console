# The nightly real-DB sweep (Francis, 26 Nov 2026). CI's `migrations` job runs every real-Postgres suite on each pull request
# and each push to main; this runs the same suites on main once a night, so one that goes red with no change behind it (a date,
# a season, a slow drift in a fixture) is found the next morning. On any red it opens an issue — or, while one is still open,
# comments on it — with the red suites and their counts.
#
# The suites are read from ci.yml's `migrations` job by scripts/nightly-real-db.mjs, never listed here. Main only: it checks out
# the default branch, runs on a throwaway Postgres made and dropped inside the run, and mints its own sealing keys, as CI does.
name: Nightly real-DB sweep

on:
  schedule:
    - cron: "17 2 * * *"   # 02:17 UTC, every night
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: nightly-real-db
  cancel-in-progress: false

jobs:
  sweep:
    name: every real-DB suite, on main
    runs-on: ubuntu-latest
    # The suites run one at a time; CI's job takes a quarter of an hour at most. An hour is a hang, not a slow night.
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nzi_nightly
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NZI_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/nzi_nightly
    steps:
      - uses: actions/checkout@v4
        with:
          # Main, named: a scheduled run's event carries no repository payload, and a dispatch from another branch still sweeps main.
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Throwaway keys for this run only, as CI's `migrations` job mints them (NZC-119).
      - name: Mint throwaway sealing keys for this run
        run: |
          {
            echo "NZI_SUBJECT_MASTER_KEY=$(openssl rand -base64 32)"
            echo "NZI_SUBJECT_INDEX_KEY=$(openssl rand -base64 32)"
            echo "NZI_SUBJECT_LINKAGE_KEY=$(openssl rand -base64 32)"
          } >> "$GITHUB_ENV"
      - name: Run every real-DB suite in ci.yml's migrations job, one at a time
        run: node scripts/nightly-real-db.mjs --report nightly-report.md
      # Red (or a step before the sweep failed): one open issue carries it. A second red night comments on it rather than
      # opening another; closing the issue is how a person says it is dealt with.
      - name: Open an issue, or comment on the open one
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -s nightly-report.md ] || printf 'The nightly real-DB sweep failed before it could report (setup or install).\n\nRun: %s\n' "$RUN_URL" > nightly-report.md
          gh label create nightly-real-db --color B60205 --description "The nightly real-DB sweep went red" 2>/dev/null || true
          open=$(gh issue list --label nightly-real-db --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body-file nightly-report.md
          else
            gh issue create --title "Nightly real-DB sweep red on main ($(date -u +%Y-%m-%d))" --label nightly-real-db --body-file nightly-report.md
          fi
